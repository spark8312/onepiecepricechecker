<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>One Piece TCG Price Checker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">

  <div class="max-w-6xl mx-auto bg-white rounded-lg shadow-md p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">
      🏴‍☠️ One Piece TCG Price Finder
    </h1>

    <div class="flex flex-col sm:flex-row gap-4 mb-8">
      <form id="search-form" class="flex-1 flex gap-4">
        <input 
          type="text" 
          id="card-number" 
          placeholder="Enter Card No (e.g. ST09-001, OP01-016, OP13-118)..." 
          class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        />
        <button 
          type="submit" 
          class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-lg transition"
        >
          Search
        </button>
      </form>

      <div class="flex items-center gap-2">
        <label for="sort-order" class="text-sm font-semibold text-gray-600 whitespace-nowrap">Sort Price:</label>
        <select 
          id="sort-order" 
          class="border border-gray-300 rounded-lg px-3 py-2 bg-white text-gray-700 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="high-low">High to Low ⬇️</option>
          <option value="low-high">Low to High ⬆️</option>
        </select>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-800 text-white">
            <th class="p-3 border text-center w-28">Card Image</th>
            <th class="p-3 border">Card No</th>
            <th class="p-3 border">Card Name (English)</th>
            <th class="p-3 border">Yuyutei (JPY)</th>
            <th class="p-3 border bg-blue-900 text-center">Conversion Rate</th>
            <th class="p-3 border bg-emerald-700">Converted Price (MYR)</th>
          </tr>
        </thead>
        <tbody id="results-body">
          <tr>
            <td colspan="6" class="p-4 text-center text-gray-500">
              Enter a card number above to search.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://onepiecepricecheckerapi.onrender.com";

    const form = document.getElementById('search-form');
    const tbody = document.getElementById('results-body');
    const sortSelect = document.getElementById('sort-order');

    let currentItems = [];
    let currentConversionRate = 0;

    function renderTable() {
      if (!currentItems || currentItems.length === 0) return;

      const sortOrder = sortSelect.value;
      
      const sortedItems = [...currentItems].sort((a, b) => {
        const priceA = a.yuyutei_jpy || 0;
        const priceB = b.yuyutei_jpy || 0;
        return sortOrder === 'high-low' ? priceB - priceA : priceA - priceB;
      });

      const formattedRate = currentConversionRate ? `1 JPY = ${currentConversionRate.toFixed(5)} MYR` : 'N/A';

      let rowsHtml = '';
      sortedItems.forEach((item) => {
        const imageHtml = `
          <img 
            src="${item.imageUrl}" 
            alt="${item.cardNo}" 
            referrerpolicy="no-referrer"
            class="h-24 mx-auto object-contain rounded shadow-sm" 
            onerror="if(this.src !== '${item.baseImageUrl}'){ this.src = '${item.baseImageUrl}'; } else { this.parentElement.innerHTML='<span class=\\'text-xs text-gray-400\\'>No Image</span>'; }" 
          />`;

        rowsHtml += `
          <tr class="hover:bg-gray-50 align-middle">
            <td class="p-2 border text-center">${imageHtml}</td>
            <td class="p-3 border font-semibold">${item.cardNo}</td>
            <td class="p-3 border font-medium text-gray-800">${item.cardName}</td>
            <td class="p-3 border font-semibold">${item.yuyutei_jpy ? `¥${item.yuyutei_jpy.toLocaleString()}` : 'N/A'}</td>
            <td class="p-3 border text-center text-xs text-gray-600 bg-blue-50 font-mono">${formattedRate}</td>
            <td class="p-3 border font-bold text-emerald-600 bg-emerald-50">
              ${item.myr_price ? `RM ${item.myr_price.toFixed(2)}` : 'N/A'}
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = rowsHtml;
    }

    sortSelect.addEventListener('change', renderTable);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const cardNo = document.getElementById('card-number').value.trim();
      
      tbody.innerHTML = `
        <tr>
          <td colspan="6" class="p-4 text-center text-blue-600 font-semibold animate-pulse">
            Fetching card data and conversion rates...
          </td>
        </tr>`;

      try {
        const response = await fetch(`${BACKEND_URL}/api/prices?card=${encodeURIComponent(cardNo)}`);
        const data = await response.json();

        if (!data.items || data.items.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="p-4 text-center text-gray-500">
                No cards found for "${cardNo}".
              </td>
            </tr>`;
          return;
        }

        currentItems = data.items;
        currentConversionRate = data.conversionRate || 0;
        renderTable();

      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="p-4 text-center text-red-500">
              Error connecting to the price server.
            </td>
          </tr>`;
      }
    });
  </script>
</body>
</html>
